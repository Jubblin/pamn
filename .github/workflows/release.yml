name: release
on:
  push: { tags: ["v*"] }
jobs:
  release:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-15-intel, args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-22.04, args: "--bundles appimage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - name: Fetch bundled nmap
        shell: bash
        run: scripts/fetch-nmap.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pamn ${{ github.ref_name }}
          releaseDraft: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
